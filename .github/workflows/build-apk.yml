name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Release APK
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon
          mkdir -p ../public
          cp app/build/outputs/apk/release/*.apk ../public/loosebudget.apk || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loosebudget-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Deploy loosebudget.apk to repository
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public
          cp android/app/build/outputs/apk/release/*.apk public/loosebudget.apk
          git add public/loosebudget.apk
          git commit -m "Auto-update public/loosebudget.apk [skip ci]" || true
          git push

